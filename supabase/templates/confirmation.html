<!doctype html>
<html lang="pt-BR">
  <head><meta charset="utf-8"><title>Confirme seu e-mail</title></head>
  <body>
    <h2>Confirme seu e-mail</h2>
    <p>Para solicitar acesso ao Diálogo Auditorias, abra a página abaixo e clique em <strong>Confirmar meu e-mail</strong>.</p>
    <p><a href="{{ .SiteURL }}/confirmar-email?token_hash={{ .TokenHash }}">Abrir confirmação de e-mail</a></p>
    <p>Após a confirmação, sua solicitação será encaminhada para análise do Administrativo.</p>
    <p>Se você não solicitou este cadastro, ignore esta mensagem.</p>
  </body>
</html>
